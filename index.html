<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOXTECHCEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#10222b;--mut:#6a7a85;--ac:#0f9d8a;--acd:#0b7a6b;--line:#d9e0e5;--bad:#c8342b}
:root[data-theme=dark]{--bg:#0e1a20;--card:#162830;--ink:#e8eff2;--mut:#8fa3ae;--line:#26414c;--ac:#22b8a3;--acd:#1a9a88}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",sans-serif}
input,select,textarea,button{font:inherit;color:inherit}a{text-decoration:none}
.pill{background:var(--bg);border:1px solid var(--ac);color:var(--acd);border-radius:99px;padding:2px 10px;font-size:12px;white-space:nowrap}.it2{cursor:pointer}.fotos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.fotos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:3px 0}
input.s{width:56px;display:inline-block}input.m{width:96px;display:inline-block}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:600;cursor:pointer}
button:hover{background:var(--acd)}button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.x{background:transparent;color:var(--bad);padding:4px 8px}button.big{width:100%;padding:15px;font-size:17px;margin-top:8px}
header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#0b161c;color:#fff;position:sticky;top:0;z-index:5;overflow-x:auto}
header b{margin-right:8px;white-space:nowrap}header button{background:transparent;color:#cfe0e6;padding:8px 12px;white-space:nowrap}
header button.on{background:var(--ac);color:#fff}
#app{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pos{display:grid;gap:12px;grid-template-columns:1fr 1fr}@media(max-width:760px){.pos{grid-template-columns:1fr}}
.it{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:3px 0;font-weight:400}
.it:hover{border-color:var(--ac);background:var(--card)}
.ln{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.tot{font-size:22px;font-weight:700}.mut{color:var(--mut)}.bad{color:var(--bad)}.ok{color:var(--acd)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pays label{font-size:13px;color:var(--mut)}.pays input{width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}td.n,th.n{text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0b161c;color:#fff;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#modal.on{display:flex}#mbox{background:var(--card);border-radius:12px;padding:16px;max-width:380px;width:100%;max-height:90vh;overflow:auto}
.tk{font-family:ui-monospace,Consolas,monospace;font-size:13px}.tk .row{padding:1px 0}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block}#mbox{box-shadow:none;max-width:72mm;padding:0}#mbox button{display:none}}
</style></head><body>
<header id="nav" hidden></header><div id="app"></div><div id="toast"></div><div id="modal"><div id="mbox"></div></div>
<script>
const URL_='https://wmmjkmegqsfmqreujhzx.supabase.co',KEY='sb_publishable_sBpj1BML-JxttnlwGjGyBw_wR08fKu7';
const sb=supabase.createClient(URL_,KEY);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((+n||0)*100)/100,dt=d=>new Date(d).toLocaleString('es-MX',{dateStyle:'short',timeStyle:'short'});
const M=[['efectivo','Efectivo'],['transferencia','Transferencia'],['tarjeta','Tarjeta'],['mercado_pago','Mercado Pago']];
const S={p:null,prods:[],cats:[],cart:[],pay:{},dsc:0};
const admin=()=>S.p.rol=='administrador';
window.onunhandledrejection=e=>e.preventDefault();
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'err show':'show';clearTimeout(t.k);t.k=setTimeout(()=>t.className='',3800)}
async function run(p){const r=await p;if(r.error){toast(r.error.message,1);throw r.error}return r.data}
function modal(h){$('#mbox').innerHTML=h;$('#modal').className='on'}const close=()=>$('#modal').className='';
const view=h=>$('#app').innerHTML=h;
function ask(t,fs,ok='Guardar'){return new Promise(res=>{modal(`<h3 style="margin-top:0">${t}</h3>${fs.map(f=>`<label>${f.l}${f.sel?`<select id=a_${f.k}>${f.sel.map(o=>`<option value=${o[0]} ${o[0]==f.v?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id=a_${f.k} type=${f.t||'text'} ${f.t=='number'?'step=any':''} value="${esc(f.v??'')}" placeholder="${esc(f.p||'')}">`}</label>`).join('')}<div class=g2 style="margin-top:10px"><button id=a_ok>${ok}</button><button class=sec id=a_no>Cancelar</button></div>`);
 if(fs[0])$('#a_'+fs[0].k).focus();const fin=v=>{close();res(v)};
 $('#a_no').onclick=()=>fin(null);$('#a_ok').onclick=()=>{const o={};fs.forEach(f=>o[f.k]=$('#a_'+f.k).value.trim());fin(o)};
 $('#mbox').onkeydown=e=>{if(e.key=='Enter')$('#a_ok').click()};$('#modal').onclick=e=>{if(e.target.id=='modal')fin(null)}})}
const ico=()=>document.documentElement.dataset.theme=='dark'?'☀️':'🌙';
try{document.documentElement.dataset.theme=localStorage.getItem('tema')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}
function tema(){const d=document.documentElement,n=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('tema',n)}catch{}document.querySelectorAll('.tb').forEach(b=>b.textContent=ico())}

/* ---------- acceso ---------- */
function loginView(){$('#nav').hidden=true;view(`<div class=card style="max-width:340px;margin:10vh auto"><button class="sec tb" onclick="tema()" style="float:right;padding:6px 10px">${ico()}</button><h2>BOXTECHCEL</h2><p class=mut>Inicia sesión para continuar</p><input id=em type=email placeholder="Correo"><input id=pw type=password placeholder="Contraseña"><button class=big id=go>Entrar</button></div>`);
 $('#go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?toast('Correo o contraseña incorrectos',1):start()};
 $('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()}}
async function start(){const{data:{user}}=await sb.auth.getUser();
 const{data}=await sb.from('perfiles').select('*').eq('id',user.id).maybeSingle();
 if(!data||!data.activo){await sb.auth.signOut();loginView();return toast('Tu usuario no tiene un perfil activo',1)}
 S.p=data;S.cats=await run(sb.from('categorias').select('*').order('nombre'));await loadProds();await loadCfg();nav();go(S.p.rol=='tecnico'?'rep':'pos')}
async function loadProds(){S.prods=await run(admin()?sb.from('productos').select('*').eq('activo',true).order('nombre'):sb.from('productos_venta').select('*').order('nombre'))}
function nav(){const r=S.p.rol,t=[];
 if(r!='tecnico')t.push(['pos','Vender']);if(r=='administrador'||r=='vendedor')t.push(['eq','Equipos']);t.push(['rep','Reparaciones']);if(r=='administrador'||r=='tecnico')t.push(['pz','Por comprar']);if(r!='tecnico')t.push(['rec','Recargas']);t.push(['inv','Inventario']);if(r!='tecnico')t.push(['ventas','Ventas']);if(r=='administrador'||r=='cajero')t.push(['caja','Caja']);if(r=='administrador'){t.push(['usr','Usuarios']);t.push(['cfg','Config'])}
 $('#nav').hidden=false;$('#nav').innerHTML='<b>BOXTECHCEL</b>'+t.map(([k,l])=>`<button data-t=${k}>${l}</button>`).join('')+'<button data-t=tema class=tb style="margin-left:auto">'+ico()+'</button><button data-t=out>Salir</button>';
 $('#nav').onclick=e=>{const k=e.target.dataset.t;if(k=='tema')return tema();if(k=='out'){sb.auth.signOut();loginView()}else if(k)go(k)}}
function go(t){document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({pos:posView,inv:invView,ventas:ventasView,caja:cajaView,rep:repView,cfg:cfgView,pz:pzView,rec:recView,usr:usrView,eq:eqView})[t]()}

/* ---------- punto de venta ---------- */
const filt=v=>S.prods.filter(p=>[p.nombre,p.sku,p.codigo_barras,p.marca,p.modelo].join(' ').toLowerCase().includes(v)).slice(0,30);
function posView(){view(`<div class=pos><div><input id=q placeholder="Buscar por nombre, SKU o código de barras" autofocus><div id=res></div><button class=sec id=svc style="margin-top:8px">+ Servicio o artículo sin código</button></div><div class=card id=cart></div></div>`);
 const q=$('#q');q.oninput=res;
 q.onkeydown=e=>{if(e.key!='Enter')return;const v=q.value.trim().toLowerCase();const m=S.prods.find(p=>(p.codigo_barras||'').toLowerCase()==v||(p.sku||'').toLowerCase()==v);const l=m?[m]:filt(v);if(l.length==1){add(l[0]);q.value='';res()}};
 $('#res').onclick=e=>{const b=e.target.closest('[data-id]');if(b){add(S.prods.find(p=>p.id==b.dataset.id));q.focus()}};
 $('#svc').onclick=async()=>{const o=await ask('Servicio o artículo sin código',[{k:'d',l:'Descripción',p:'Ej. Instalación de mica'},{k:'p',l:'Precio al cliente',t:'number'},...(admin()?[{k:'c',l:'Costo (0 si no tiene)',t:'number',v:0}]:[])]);
  if(!o)return;const pr=parseFloat(o.p);if(!o.d||!(pr>=0))return toast('Escribe la descripción y el precio',1);
  S.cart.push({producto_id:null,tipo:'servicio',descripcion:o.d,cantidad:1,precio_unitario:pr,costo_unitario:parseFloat(o.c)||0,max:1e9});drawCart()};
 res();drawCart()}
function res(){const v=$('#q').value.trim().toLowerCase(),l=v?filt(v):S.prods.slice(0,12);
 $('#res').innerHTML=l.map(p=>`<button class=it data-id=${p.id}><span>${esc(p.nombre)}<br><small class=mut>${esc(p.sku||'')} ${p.controla_stock?'· existencia '+p.existencia:''}</small></span><b>${money(p.precio)}</b></button>`).join('')||'<p class=mut>Sin resultados. Usa el botón de abajo para vender algo sin código.</p>'}
function add(p){if(!p)return;if(p.controla_stock&&+p.existencia<=0)return toast('Sin existencia de '+p.nombre,1);
 const x=S.cart.find(i=>i.producto_id==p.id);if(x){if(x.cantidad<x.max)x.cantidad++;else toast('No hay más existencia',1)}
 else S.cart.push({producto_id:p.id,tipo:'producto',descripcion:p.nombre,cantidad:1,precio_unitario:+p.precio,max:p.controla_stock?+p.existencia:1e9});drawCart()}
const sub=()=>S.cart.reduce((a,i)=>a+i.cantidad*i.precio_unitario,0);
function upd(){const t=r2(sub()-S.dsc),pd=r2(M.reduce((a,[k])=>a+(+S.pay[k]||0),0)),d=r2(t-pd);$('#tot').textContent=money(t);
 const r=$('#rest');r.textContent=d>0?'Falta '+money(d):d<0?'Sobra '+money(-d):'Pagos completos';r.className=d==0&&t>0?'ok':'bad'}
function drawCart(){$('#cart').innerHTML=`<h3 style="margin-top:0">Venta</h3>${S.cart.map((i,n)=>`<div class=ln><b>${esc(i.descripcion)}</b><button class=x data-del=${n}>✕</button><span><input class=s type=number min=1 value=${i.cantidad} data-n=${n} data-f=cantidad> × <input class=m type=number min=0 step=any value=${i.precio_unitario} data-n=${n} data-f=precio_unitario></span></div>`).join('')||'<p class=mut>Busca un producto o agrega un servicio para empezar.</p>'}
 <div class=row><span>Subtotal</span><b>${money(sub())}</b></div><div class=row><span>Descuento</span><input class=m type=number min=0 step=any id=dsc value="${S.dsc||''}"></div>
 <div class="row tot"><span>Total</span><b id=tot></b></div><div class=pays>${M.map(([k,l])=>`<label>${l}<input type=number min=0 step=any data-pay=${k} value="${S.pay[k]||''}"></label>`).join('')}</div>
 <div class=row><b id=rest></b><button class=sec id=fill>Todo en efectivo</button></div><button class=big id=cobrar>Cobrar</button>`;
 const c=$('#cart');upd();
 c.onclick=e=>{const d=e.target.dataset;if(d.del!=null){S.cart.splice(+d.del,1);drawCart()}};
 c.onchange=e=>{const d=e.target.dataset,v=+e.target.value;if(d.f){const i=S.cart[d.n];if(d.f=='cantidad'&&v>i.max){toast('Existencia máxima: '+i.max,1);i.cantidad=i.max}else i[d.f]=v;drawCart()}};
 c.oninput=e=>{const d=e.target.dataset;if(d.pay){S.pay[d.pay]=+e.target.value;upd()}else if(e.target.id=='dsc'){S.dsc=+e.target.value;upd()}};
 $('#fill').onclick=()=>{S.pay={efectivo:r2(sub()-S.dsc)};drawCart()};$('#cobrar').onclick=cobrar}
async function cobrar(){if(!S.cart.length)return toast('Agrega algo a la venta',1);
 const pagos=M.map(([k])=>({metodo:k,monto:r2(S.pay[k])})).filter(x=>x.monto>0);
 const items=S.cart.map(i=>({producto_id:i.producto_id,tipo:i.tipo,descripcion:i.descripcion,cantidad:i.cantidad,precio_unitario:r2(i.precio_unitario),costo_unitario:r2(i.costo_unitario)}));
 const b=$('#cobrar');b.disabled=true;
 try{const r=await run(sb.rpc('crear_venta',{p_cliente:null,p_descuento:r2(S.dsc),p_items:items,p_pagos:pagos,p_notas:null}));
  S.cart=[];S.pay={};S.dsc=0;await loadProds();posView();toast('Venta '+r.folio+' guardada');ticket(r.venta_id)}catch{b.disabled=false}}
async function ticket(id){const g=async t=>(await sb.from(t).select('*').eq(t=='ventas_vista'?'id':'venta_id',id)).data||[];
 const[[v],d,p,cf]=await Promise.all([g('ventas_vista'),g('detalle_ventas_vista'),g('venta_pagos'),sb.from('configuracion').select('*')]);
 const c=Object.fromEntries((cf.data||[]).map(x=>[x.clave,x.valor]));
 modal(`<div class=tk><div style="text-align:center">${c.logo_url?`<img src="${esc(c.logo_url)}" style="max-height:60px"><br>`:''}<b>${esc(c.negocio_nombre||'BOXTECHCEL')}</b><br>${esc(v.folio)} · ${dt(v.creado_en)}${v.estado=='cancelada'?'<br><b>CANCELADA</b>':''}</div><hr>
 ${d.map(i=>`<div class=row><span>${i.cantidad} × ${esc(i.descripcion)}</span><span>${money(i.cantidad*i.precio_unitario)}</span></div>`).join('')}<hr>
 ${+v.descuento?`<div class=row><span>Descuento</span><span>-${money(v.descuento)}</span></div>`:''}<div class=row><b>TOTAL</b><b>${money(v.total)}</b></div>
 ${p.map(x=>`<div class=row><span>${esc(M.find(m=>m[0]==x.metodo)?.[1]||x.metodo)}</span><span>${money(x.monto)}</span></div>`).join('')}
 <p style="text-align:center">${esc(c.ticket_pie||'')}</p></div><div class=g2><button onclick="print()">Imprimir</button><button class=sec onclick="close_()">Cerrar</button></div>`)}
window.close_=close;

/* ---------- inventario ---------- */
async function invView(){if(admin())await loadAnt();view(`${admin()?antKpi():''}<div class=g2 style="margin-bottom:8px"><input id=q placeholder="Buscar producto">${admin()?`<select id=fi><option value=''>Todos</option><option value=nuevos>Más nuevos</option><option value=viejos>Más antiguos</option><option value=costo>Mayor costo inmovilizado</option><option value=rot>Menor rotación</option><option value=bajo>Stock bajo</option><option value=sinmov>Sin movimiento (60+ días)</option></select>`:''}</div><button id=nw>+ Nuevo producto</button><div class=card style="margin-top:10px;overflow-x:auto"><table id=tb></table></div>`);
 const draw=()=>{const v=$('#q').value.trim().toLowerCase(),l=sortFilt(v?filt(v):S.prods);
  $('#tb').innerHTML=`<tr><th>Producto</th><th class=n>Existencia</th><th class=n>Precio</th>${admin()?'<th class=n>Costo</th><th class=n>Margen</th><th class=n>Días</th><th class=n>Valor</th><th></th>':''}</tr>`+l.map(p=>{const low=admin()&&p.controla_stock&&+p.existencia<=+p.existencia_minima;
   return`<tr><td>${esc(p.nombre)}${p.por_revisar?' <span class=pill>Por revisar</span>':''}<br><small class=mut>${esc(p.sku||'')}</small></td><td class="n ${low?'bad':''}">${p.controla_stock?p.existencia:'—'}</td><td class=n>${money(p.precio)}</td>${admin()?`<td class=n>${money(p.costo)}</td><td class=n>${+p.precio?Math.round((p.precio-p.costo)/p.precio*100)+'%':'—'}</td>${diasTd(p)}<td class=n><button class=sec data-e=${p.id}>Editar</button> <button class=sec data-a=${p.id}>±</button></td>`:''}</tr>`}).join('')};
 $('#q').oninput=draw;if($('#fi'))$('#fi').onchange=draw;draw();if(!admin())$('#nw').onclick=()=>form();
 if(admin()){$('#nw').onclick=()=>form();$('#tb').onclick=async e=>{const d=e.target.dataset;
  if(d.e)form(S.prods.find(p=>p.id==d.e));
  if(d.a){const p=S.prods.find(x=>x.id==d.a),o=await ask('Ajustar existencia: '+esc(p.nombre),[{k:'n',l:'Existencia actual: '+p.existencia+'. Cantidad a sumar (negativa para restar)',t:'number'},{k:'m',l:'Motivo',v:'Conteo físico'}]);
   if(!o)return;const n=parseFloat(o.n);if(!n)return toast('Escribe una cantidad distinta de cero',1);
   await run(sb.rpc('ajustar_inventario',{p_producto:p.id,p_cantidad:n,p_tipo:n<0&&/merma/i.test(o.m)?'merma':'ajuste',p_notas:o.m}));await loadProds();invView();toast('Inventario ajustado')}}}}
function form(p){const f=(k,l,t='text')=>`<label>${l}<input id=f_${k} type=${t} ${t=='number'?'step=any min=0':''} value="${esc(p?p[k]:'')}"></label>`;
 modal(`<h3 style="margin-top:0">${p?'Editar':'Nuevo'} producto</h3>${f('nombre','Nombre')}<div class=g2>${f('sku','SKU')}${f('codigo_barras','Código de barras')}</div>
 <label>Categoría<select id=f_cat><option value="">—</option>${S.cats.map(c=>`<option value=${c.id} ${p&&p.categoria_id==c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></label>
 <div class=g2>${f('marca','Marca')}${f('modelo','Modelo')}</div><div class=g2>${f('costo','Costo','number')}${f('precio','Precio','number')}</div>
 <div class=g2>${f('precio_minimo','Precio mínimo','number')}${f('existencia_minima','Existencia mínima','number')}</div>${f('fecha_entrada','Fecha de entrada al inventario (mide los días en stock)','date')}
 ${p?'':`<label>Existencia inicial<input id=f_ini type=number min=0 step=any value=0></label>`}
 <label><input type=checkbox id=f_cs style="width:auto" ${!p||p.controla_stock?'checked':''}> Controlar existencia (desmarca si es un servicio)</label>
 <div class=g2 style="margin-top:10px"><button id=sv>Guardar</button><button class=sec onclick="close_()">Cancelar</button></div>`);
 $('#sv').onclick=async()=>{const v=k=>$('#f_'+k).value.trim(),n=k=>+v(k)||0;if(!v('nombre'))return toast('Escribe el nombre',1);
  const o={nombre:v('nombre'),sku:v('sku')||null,codigo_barras:v('codigo_barras')||null,categoria_id:+$('#f_cat').value||null,marca:v('marca')||null,modelo:v('modelo')||null,
   costo:n('costo'),precio:n('precio'),precio_minimo:n('precio_minimo'),existencia_minima:n('existencia_minima'),controla_stock:$('#f_cs').checked,fecha_entrada:v('fecha_entrada')||undefined};
  if(o.precio_minimo>o.precio)return toast('El precio mínimo no puede ser mayor al precio',1);
  if(p)await run(sb.from('productos').update({...o,por_revisar:false}).eq('id',p.id));
  else await run(sb.rpc('alta_producto',{p:{...o,existencia_inicial:n('ini')}}));
  close();await loadProds();invView();toast('Producto guardado')}}

/* ---------- ventas ---------- */
async function ventasView(){const d=S.vd||new Date().toLocaleDateString('en-CA'),a=new Date(d+'T00:00:00'),b=new Date(+a+864e5);

  if(!o)return;await fn({accion:'crear',nombre:o.n,email:o.e,password:o.p,rol:o.r});await loadCfg();toast('Usuario creado');usrView()};
 $('#app').onclick=async e=>{const d=e.target.dataset,u=l.find(x=>x.id==(d.e||d.k));if(!u)return;
  if(d.e){const o=await ask('Editar usuario',[{k:'n',l:'Nombre',v:u.nombre},{k:'r',l:'Rol',sel:ROLES,v:u.rol},{k:'a',l:'Estado',sel:[['1','Activo'],['0','Desactivado']],v:u.activo?'1':'0'}]);
   if(!o)return;await run(sb.rpc('actualizar_perfil',{p_id:u.id,p_nombre:o.n,p_rol:o.r,p_activo:o.a=='1'}));await loadCfg();toast('Usuario actualizado');usrView()}
  if(d.k){const o=await ask('Nueva contraseña de '+esc(u.nombre),[{k:'p',l:'Contraseña (mínimo 8 caracteres)'}]);if(!o)return;await fn({accion:'password',id:u.id,password:o.p});toast('Contraseña cambiada')}}}

/* ---------- reparaciones ---------- */
const ES=[['recibido','Recibido'],['en_diagnostico','En diagnóstico'],['diagnostico_realizado','Diagnóstico realizado'],['esperando_autorizacion','Esperando autorización'],['esperando_refaccion','Esperando refacción'],['en_reparacion','En reparación'],['reparado','Reparado'],['probando_equipo','Probando equipo'],['listo_para_entregar','Listo para entregar'],['entregado','Entregado'],['no_reparado','No reparado'],['cancelado','Cancelado']];
const WA=[['wa_recibido','Ticket recibido'],['wa_diagnostico','Diagnóstico terminado'],['wa_autorizada','Reparación autorizada'],['wa_listo','Equipo listo'],['wa_entregado','Equipo entregado'],['wa_recordatorio','Recordatorio de equipo pendiente']];
const TIPOS=['Celular','Tablet','Laptop','Computadora','PC','MacBook','iPad','Apple Watch','Smartwatch','Consola','Pantalla/TV','Bocina','Otro'];
const en=k=>ES.find(e=>e[0]==k)?.[1]||k,fd=d=>d?new Date(d).toLocaleDateString('es-MX'):'—',gar=r=>r.fecha_entrega&&r.garantia_dias?fd(+new Date(r.fecha_entrega)+r.garantia_dias*864e5):'—';
let CFG={},TEC=[];
async function loadCfg(){const[c,t]=await Promise.all([sb.from('configuracion').select('*'),sb.from('equipo_nombres').select('*')]);CFG=Object.fromEntries((c.data||[]).map(x=>[x.clave,x.valor]));TEC=t.data||[]}
async function repView(){S.reps=await run(sb.from('reparaciones').select('*,clientes(nombre,telefono,whatsapp)').order('creado_en',{ascending:false}).limit(300));
 view(`<div class=g2><input id=q placeholder="Buscar ticket, cliente, teléfono, IMEI, modelo"><select id=fe><option value="">Todos los estados</option><option value=_a>Abiertas</option>${ES.map(e=>`<option value=${e[0]}>${e[1]}</option>`).join('')}</select></div>${S.p.rol!='tecnico'?'<button id=nr class=big>+ Nueva reparación</button>':''}<div id=rl style="margin-top:10px"></div>`);
 const dr=()=>{const v=$('#q').value.trim().toLowerCase(),f=$('#fe').value;$('#rl').innerHTML=S.reps.filter(r=>(!f||(f=='_a'?!['entregado','cancelado','no_reparado'].includes(r.estado):r.estado==f))&&(!v||[r.folio,r.clientes?.nombre,r.clientes?.telefono,r.clientes?.whatsapp,r.imei,r.serie,r.marca,r.modelo].join(' ').toLowerCase().includes(v))).map(r=>`<div class="card it2" data-r=${r.id}><div class=row><b>${r.folio}</b><span class=pill>${en(r.estado)}</span></div><div>${esc(r.clientes?.nombre)} · ${esc([r.tipo_equipo,r.marca,r.modelo].filter(Boolean).join(' '))}</div><small class=mut>${esc(r.falla)} · prometida ${fd(r.fecha_prometida)}</small></div>`).join('')||'<p class=mut>No hay reparaciones.</p>'};
 $('#q').oninput=dr;$('#fe').onchange=dr;dr();$('#rl').onclick=e=>{const c=e.target.closest('[data-r]');if(c)repDet(c.dataset.r)};if($('#nr'))$('#nr').onclick=repForm}
function repForm(){const f=(k,l,t='text',x='')=>`<label>${l}<input id=r_${k} type=${t} ${x}></label>`,n='min=0 step=any';
 view(`<div class=card><h3 style="margin-top:0">Nueva reparación</h3><div class=g2>${f('nombre','Nombre del cliente *')}${f('telefono','Teléfono','tel')}</div><div class=g2>${f('whatsapp','WhatsApp (si es distinto)','tel')}${f('correo','Correo','email')}</div><hr>
 <div class=g2><label>Tipo de equipo *<select id=r_tipo>${TIPOS.map(t=>`<option>${t}</option>`).join('')}</select></label>${f('otro','Si es "Otro", escribe cuál')}</div>
 <div class=g2>${f('marca','Marca')}${f('modelo','Modelo')}</div><div class=g2>${f('color','Color')}${f('capacidad','Capacidad')}</div><div class=g2>${f('imei','IMEI')}${f('serie','Número de serie')}</div>
 ${f('password_equipo','Contraseña o PIN (si el cliente la da)')}${f('falla','Falla reportada *')}${f('estado_fisico','Estado físico (rayones, golpes, pantalla…)')}${f('accesorios','Accesorios entregados')}${f('observaciones','Observaciones')}<hr>
 <div class=g2>${f('fecha_prometida','Fecha prometida','date')}<label>Técnico responsable<select id=r_tec><option value="">Sin asignar</option>${tecOpts('')}</select></label></div>
 <div class=g2>${f('presupuesto','Presupuesto inicial','number',n)}${f('anticipo','Anticipo','number',n)}</div>
 <div class=g2><label>Método del anticipo<select id=r_met><option value="">—</option>${M.map(m=>`<option value=${m[0]}>${m[1]}</option>`).join('')}</select></label><label>Garantía<select id=r_gar>${[0,7,15,21,30].map(d=>`<option value=${d}>${d?d+' días':'Sin garantía'}</option>`).join('')}</select></label></div>
 <div class=g2 style="margin-top:10px"><button id=rg>Guardar y ver ticket</button><button class=sec id=rc>Cancelar</button></div></div>`);
 $('#rc').onclick=repView;
 $('#rg').onclick=async()=>{const v=k=>$('#r_'+k).value.trim();if(!v('nombre')||!v('falla'))return toast('Escribe el nombre del cliente y la falla',1);
  const r=await run(sb.rpc('crear_reparacion',{p:{nombre:v('nombre'),telefono:v('telefono'),whatsapp:v('whatsapp'),correo:v('correo'),tipo_equipo:v('tipo')=='Otro'?(v('otro')||'Otro'):v('tipo'),marca:v('marca'),modelo:v('modelo'),color:v('color'),capacidad:v('capacidad'),imei:v('imei'),serie:v('serie'),password_equipo:v('password_equipo'),falla:v('falla'),estado_fisico:v('estado_fisico'),accesorios:v('accesorios'),observaciones:v('observaciones'),fecha_prometida:v('fecha_prometida'),tecnico_id:$('#r_tec').value,presupuesto:r2(v('presupuesto')),anticipo:r2(v('anticipo')),anticipo_metodo:$('#r_met').value,garantia_dias:+$('#r_gar').value}}));
  toast('Ticket '+r.folio+' creado');await repView();repDet(r.id)}}
async function repDet(id){const[r,h,pz,pg,ft]=await Promise.all([run(sb.from('reparaciones').select('*,clientes(*)').eq('id',id).single()),run(sb.from('reparacion_historial').select('*').eq('reparacion_id',id).order('creado_en')),run(sb.from('reparacion_piezas').select('*').eq('reparacion_id',id).order('creado_en')),run(sb.from('reparacion_pagos').select('*').eq('reparacion_id',id).order('creado_en')),run(sb.from('reparacion_fotos').select('*').eq('reparacion_id',id).order('creado_en'))]);
 const urls=ft.length?(await sb.storage.from('fotos-reparaciones').createSignedUrls(ft.map(x=>x.ruta),3600)).data||[]:[];r.pagado=pg.reduce((a,x)=>a+ +x.monto,0);const c=r.clientes,tec=TEC.find(t=>t.id==r.tecnico_id),canW=admin()||(S.p.rol=='tecnico'&&r.tecnico_id==S.p.id);
 modal(`<h3 style="margin-top:0">${r.folio} <span class=pill>${en(r.estado)}</span></h3>
 <p><b>${esc(c.nombre)}</b> · ${esc(c.telefono||c.whatsapp||'')}<br>${esc([r.tipo_equipo,r.marca,r.modelo,r.color,r.capacidad].filter(Boolean).join(' · '))}<br>IMEI/serie: ${esc(r.imei||r.serie||'—')}${r.password_equipo?' · PIN: '+esc(r.password_equipo):''}<br>Falla: ${esc(r.falla)}<br>Estado físico: ${esc(r.estado_fisico||'—')}<br>Accesorios: ${esc(r.accesorios||'—')}</p>
 ${S.p.rol!='tecnico'?`<div class=row><span>Presupuesto ${money(r.presupuesto)} · Pagado ${money(r.pagado)}</span><b>Saldo ${money(r.presupuesto-r.pagado)}</b></div><div class=g2><button class=sec id=d_pg>Registrar pago</button><button class=sec id=d_pr>Cambiar presupuesto</button></div>`:''}<small class=mut>Técnico: ${esc(tec?.nombre||'sin asignar')} · prometida ${fd(r.fecha_prometida)} · garantía ${r.garantia_dias?r.garantia_dias+' días':'ninguna'}</small>
 ${S.p.rol!='tecnico'?`<div class=g2 style="margin-top:6px"><label>Asignado a<select id=d_tc><option value="">Sin asignar</option>${tecOpts(r.tecnico_id)}</select></label><label>Fecha prometida<input id=d_fp type=date value="${r.fecha_prometida||''}"></label></div><button class=sec id=d_as>Guardar asignación</button>`:''}
 ${canW?piezasHtml(r,pz):''}
 ${fotosHtml(ft,urls)}
 <hr><label>Cambiar estado<select id=d_es>${ES.map(e=>`<option value=${e[0]} ${e[0]==r.estado?'selected':''}>${e[1]}</option>`).join('')}</select></label><input id=d_nt placeholder="Nota (opcional)"><button id=d_ce style="margin-top:6px">Actualizar estado</button>
 ${canW?`<hr><label>Diagnóstico<input id=d_dg value="${esc(r.diagnostico)}"></label><label>Notas técnicas<input id=d_nn value="${esc(r.notas_tecnicas)}"></label><label>Mano de obra<input id=d_mo type=number min=0 step=any value="${r.mano_obra}"></label><button class=sec id=d_gt>Guardar trabajo técnico</button>`:`<p><b>Diagnóstico:</b> ${esc(r.diagnostico||'—')}</p>`}
 ${pg.length?`<hr><b>Pagos</b>${pg.map(x=>`<div class=row><small>${esc(M.find(m=>m[0]==x.metodo)?.[1]||x.metodo)}${x.nota?' · '+esc(x.nota):''}</small><small>${money(x.monto)} · ${dt(x.creado_en)}</small></div>`).join('')}`:''}<hr><b>Historial</b>${h.map(x=>`<div class=row><small>${en(x.estado)}${x.nota?' · '+esc(x.nota):''}</small><small class=mut>${dt(x.creado_en)}</small></div>`).join('')}
 <hr><div class=g2><button id=d_tk>Ticket</button><button class=sec id=d_wa>WhatsApp…</button></div><button class="sec big" onclick="close_()">Cerrar</button>`);
 $('#d_ce').onclick=async()=>{const sd=r2(r.presupuesto-r.pagado);if($('#d_es').value=='entregado'&&sd>0&&!await ask('Hay saldo pendiente de '+money(sd)+'. ¿Entregar de todas formas?',[],'Sí, entregar'))return repDet(id);await run(sb.rpc('cambiar_estado_reparacion',{p_id:id,p_estado:$('#d_es').value,p_nota:$('#d_nt').value||null}));toast('Estado actualizado');await repView();repDet(id)};
 if($('#d_gt'))$('#d_gt').onclick=async()=>{await run(sb.rpc('actualizar_trabajo_reparacion',{p_id:id,p_diagnostico:$('#d_dg').value,p_notas:$('#d_nn').value,p_mano_obra:r2($('#d_mo').value)}));toast('Guardado');repDet(id)};
 if($('#d_as'))$('#d_as').onclick=async()=>{await run(sb.rpc('asignar_reparacion',{p_id:id,p_tecnico:$('#d_tc').value||null,p_fecha:$('#d_fp').value||null}));toast('Asignación guardada');await repView();repDet(id)};
 document.querySelectorAll('[data-pz]').forEach(b=>b.onchange=async()=>{const x=pz.find(z=>z.id==b.dataset.pz);await run(sb.rpc('guardar_pieza',{p_id:x.id,p_reparacion:r.id,p_desc:x.descripcion,p_cant:x.cantidad,p_costo:x.costo,p_comprada:b.checked,p_prov:x.proveedor}));repDet(id)});
 document.querySelectorAll('[data-pd]').forEach(b=>b.onclick=async()=>{await run(sb.rpc('borrar_pieza',{p_id:b.dataset.pd}));repDet(id)});
 if($('#d_pa'))$('#d_pa').onclick=async()=>{const o=await ask('Agregar pieza',[{k:'d',l:'Pieza',p:'Ej. Batería iPhone 13'},{k:'c',l:'Costo por pieza',t:'number'},{k:'n',l:'Cantidad',t:'number',v:1},{k:'p',l:'Proveedor (opcional)'}]);
  if(o&&o.d)await run(sb.rpc('guardar_pieza',{p_id:null,p_reparacion:r.id,p_desc:o.d,p_cant:Math.max(1,parseInt(o.n)||1),p_costo:r2(o.c),p_comprada:false,p_prov:o.p}));repDet(id)};
 if($('#d_pg'))$('#d_pg').onclick=async()=>{const sd=r2(r.presupuesto-r.pagado),o=await ask('Registrar pago · saldo '+money(sd),[{k:'m',l:'Monto',t:'number',v:sd>0?sd:''},{k:'t',l:'Método',sel:M}],'Registrar');
  if(o){try{await run(sb.rpc('registrar_pago_reparacion',{p_id:id,p_monto:r2(o.m),p_metodo:o.t}));toast('Pago registrado')}catch{}}repDet(id)};
 if($('#d_pr'))$('#d_pr').onclick=async()=>{const o=await ask('Cambiar presupuesto',[{k:'m',l:'Nuevo presupuesto',t:'number',v:r.presupuesto}]);
  if(o){try{await run(sb.rpc('actualizar_presupuesto',{p_id:id,p_monto:r2(o.m)}));toast('Presupuesto actualizado');await repView()}catch{}}repDet(id)};
 if($('#d_pi'))$('#d_pi').onclick=()=>pickRef(id);
 $('#d_fb').onclick=()=>$('#d_ft').click();
 $('#d_ft').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;toast('Subiendo '+fs.length+' foto(s)…');
  try{for(const f of fs){const b=await imgBlob(f,1280),ruta=`${id}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.jpg`;
   await run(sb.storage.from('fotos-reparaciones').upload(ruta,b,{contentType:'image/jpeg'}));await run(sb.rpc('registrar_foto',{p_reparacion:id,p_ruta:ruta}))}toast('Fotos guardadas')}catch{}repDet(id)};
 $('#d_tk').onclick=()=>repTicket(r,c,tec);$('#d_wa').onclick=()=>repWa(r,c)}
function repTicket(r,c,tec){modal(`<div class=tk><div style="text-align:center">${CFG.logo_url?`<img src="${esc(CFG.logo_url)}" style="max-height:60px"><br>`:''}<b>${esc(CFG.negocio_nombre||'BOXTECHCEL')}</b><br>${esc(CFG.negocio_telefono||'')}<br><b>${r.folio}</b><br>${dt(r.creado_en)}</div><hr>
 <div>Cliente: ${esc(c.nombre)}<br>Tel: ${esc(c.telefono||c.whatsapp||'')}<br>Equipo: ${esc([r.tipo_equipo,r.marca,r.modelo].filter(Boolean).join(' '))}<br>IMEI/Serie: ${esc(r.imei||r.serie||'—')}<br>Falla: ${esc(r.falla)}<br>Estado físico: ${esc(r.estado_fisico||'—')}<br>Accesorios: ${esc(r.accesorios||'—')}${r.password_equipo?'<br>PIN: '+esc(r.password_equipo):''}<br>Técnico: ${esc(tec?.nombre||'—')}<br>Entrega estimada: ${fd(r.fecha_prometida)}${r.observaciones?'<br>Obs: '+esc(r.observaciones):''}</div><hr>
 <div class=row><span>Presupuesto</span><span>${money(r.presupuesto)}</span></div><div class=row><span>Pagado</span><span>${money(r.pagado)}</span></div><div class=row><b>Saldo</b><b>${money(r.presupuesto-r.pagado)}</b></div>
 ${r.garantia_dias?`<div class=row><span>Garantía</span><span>${r.garantia_dias} días${r.fecha_entrega?' (hasta '+gar(r)+')':' desde la entrega'}</span></div>`:''}<hr><small>${esc(CFG.terminos_reparacion||'')}</small></div><div class=g2 style="margin-top:8px"><button onclick="print()">Imprimir</button><button class=sec onclick="close_()">Cerrar</button></div>`)}
function repWa(r,c){const n=(c.whatsapp||c.telefono||'').replace(/\D/g,'');if(!n)return toast('El cliente no tiene WhatsApp ni teléfono',1);const num=n.length==10?'52'+n:n;
 const msg=k=>(CFG[k]||'').replace(/\{(\w+)\}/g,(_,x)=>({nombre:c.nombre,folio:r.folio,equipo:[r.marca,r.modelo].filter(Boolean).join(' ')||r.tipo_equipo,falla:r.falla,estado:en(r.estado),recepcion:fd(r.creado_en),estimada:fd(r.fecha_prometida),garantia:gar(r),negocio:CFG.negocio_nombre||'',telefono:CFG.negocio_telefono||''}[x]??''));
 modal(`<h3 style="margin-top:0">Enviar por WhatsApp</h3>${WA.map(([k,l])=>`<a href="https://wa.me/${num}?text=${encodeURIComponent(msg(k))}" target=_blank rel=noopener><button class=big style="margin:4px 0">${l}</button></a>`).join('')}<button class="sec big" onclick="close_()">Cerrar</button>`)}
async function cfgView(){await loadCfg();const K=[['negocio_nombre','Nombre del negocio'],['negocio_telefono','Teléfono del negocio'],['recarga_comision_pct','Comisión de recargas Taecel (%)'],['terminos_reparacion','Términos y condiciones de reparación'],...WA.map(([k,l])=>[k,'Mensaje WhatsApp: '+l])];
 view(`<div class=card><h3 style="margin-top:0">Configuración</h3><label>Logo del negocio (sale en los tickets)<input type=file id=lg accept="image/*"></label>${CFG.logo_url?`<img src="${esc(CFG.logo_url)}" style="max-height:60px;margin:6px 0">`:''}<p class=mut>En los mensajes puedes usar: {nombre} {folio} {equipo} {falla} {estado} {recepcion} {estimada} {garantia} {negocio} {telefono}</p>${K.map(([k,l])=>`<label>${l}<textarea id=c_${k} rows=${k[0]=='w'||k[0]=='t'?5:1}>${esc(CFG[k])}</textarea></label>`).join('')}<button class=big id=cs>Guardar</button></div>`);
 $('#lg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const b=await imgBlob(f,400,'image/png');await run(sb.storage.from('logo').upload('logo.png',b,{upsert:true,contentType:'image/png'}));
  const u=sb.storage.from('logo').getPublicUrl('logo.png').data.publicUrl+'?v='+Date.now();await run(sb.from('configuracion').upsert({clave:'logo_url',valor:u}));await loadCfg();toast('Logo guardado');cfgView()}catch{}};
 $('#cs').onclick=async()=>{await run(sb.from('configuracion').upsert(K.map(([k])=>({clave:k,valor:$('#c_'+k).value}))));await loadCfg();toast('Configuración guardada')}}

sb.auth.getSession().then(({data})=>data.session?start():loginView());
</script></body></html>
